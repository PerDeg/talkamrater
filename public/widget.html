<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talkamrater</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="widget.css">
</head>
<body>
<a class="tb" id="tb" target="_blank" rel="noopener" hidden>
  <span class="tb-pet" id="tbPet" aria-hidden="true"></span>
  <span class="tb-bubble" id="tbText"></span>
</a>
<div class="tk" id="tk" aria-live="polite" hidden>
  <form class="tk-form" id="form" hidden>
    <input id="code" placeholder="Klasskod" aria-label="Klasskod" autocomplete="off" autocapitalize="characters" required>
    <input id="name" placeholder="Namn" aria-label="Namn i spelet" autocomplete="off">
    <button type="submit">Visa</button>
    <p class="tk-err" id="err"></p>
  </form>
  <div id="view" hidden>
    <div class="tk-head">
      <span class="tk-brand">Talkamrater · <span id="cls"></span></span>
      <a id="play" class="tk-play" target="_blank" rel="noopener">Spela →</a>
    </div>
    <div class="tk-row tk-mission"><span id="mTitle"></span><b id="mNum"></b></div>
    <div class="tk-bar" role="progressbar" aria-label="Veckans uppdrag"><i id="mBar"></i></div>
    <div class="tk-row tk-me" id="me" hidden></div>
    <div class="tk-row tk-pet" id="pet" hidden></div>
    <p class="tk-muted" id="miss" hidden></p>
    <ul class="tk-feed" id="feed" hidden></ul>
  </div>
</div>
<script src="widget.js"></script>
</body>
</html>
