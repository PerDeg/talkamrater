<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talkamrater – lärarsida</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Ccircle cx=%2226%22 cy=%2236%22 r=%2220%22 fill=%22%232F6BFF%22/%3E%3Ccircle cx=%2246%22 cy=%2240%22 r=%2215%22 fill=%22%23FF6B3D%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="./"><span class="logo" aria-hidden="true"><span></span><span></span></span><span class="brand-name">Talkamrater</span></a>
    <span class="pill" id="whoami">Lärarsida</span>
  </header>

  <section class="panel" id="loginBox">
    <div class="label">Logga in som lärare eller förälder</div>
    <form id="loginForm" class="adm-form">
      <label for="adminKey">Skolans lärarnyckel, eller adminnyckeln (ADMIN_KEY på servern)</label>
      <input class="textfield" id="adminKey" type="password" autocomplete="current-password">
      <button class="chunky" type="submit">Logga in</button>
      <p class="error" id="loginErr"></p>
    </form>
  </section>

  <div id="main" hidden>
    <nav class="adm-nav" id="admNav" aria-label="Välj klass"></nav>
    <section class="panel" id="schoolsBox" data-view="skola" hidden>
      <div class="label">Skolor <small>Varje skola får en egen lärarnyckel</small></div>
      <form id="newSchool" class="adm-form inline two">
        <div><label for="schoolName">Ny skola</label><input class="textfield" id="schoolName" placeholder="Ängsskolan" maxlength="64" required></div>
        <button class="chunky coral" type="submit">Skapa skola</button>
      </form>
      <p class="error" id="schoolErr"></p>
      <div class="adm-keybox" id="keyBox" hidden></div>
      <div id="schools"></div>
    </section>
    <div id="contests" data-view="skola"></div>
    <section class="panel" data-view="ny">
      <div class="label">Ny klass</div>
      <form id="newClass" class="adm-form inline">
        <div><label for="className">Namn</label><input class="textfield" id="className" placeholder="Klass 2B" maxlength="24" required></div>
        <div><label for="classGoal">Stjärnburkens mål</label><input class="textfield" id="classGoal" type="number" min="10" value="500"></div>
        <div id="classSchoolWrap" hidden><label for="classSchool">Skola</label><select id="classSchool" class="adm-select"></select></div>
        <button class="chunky coral" type="submit">Skapa klass</button>
      </form>
      <p class="error" id="newErr"></p>
    </section>
    <div id="classes"></div>
    <p class="adm-foot"><button class="textbtn" id="logout">Logga ut från lärarsidan</button></p>
  </div>
</div>
<dialog class="adm-modal" id="modal"><form method="dialog" class="adm-modal-close"><button class="small-btn" aria-label="Stäng">✕</button></form><div id="modalBody"></div></dialog>
<script src="admin.js"></script>
</body>
</html>
