# Exempel för Unraid (Compose Manager) eller vanlig Docker.
# Bygg imagen från repots rot:  docker build -t talkamrater .
services:
  talkamrater:
    image: talkamrater:latest
    build: ..
    container_name: talkamrater
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "3000:3000"
    # Behövs bara med DB_CLIENT=sqlite. På Unraid ägs appdata av 99:100,
    # därför körs containern som den användaren.
    # user: "99:100"
    # volumes:
    #   - /mnt/user/appdata/talkamrater:/data
