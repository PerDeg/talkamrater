# ---------- Alternativ A: egen (sub)domän ----------
# t.ex. https://talkamrater.dindoman.se
server {
    listen 443 ssl;
    http2 on;
    server_name talkamrater.dindoman.se;

    # ssl_certificate     /etc/letsencrypt/live/dindoman.se/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dindoman.se/privkey.pem;

    client_max_body_size 128k;

    location / {
        proxy_pass         http://192.168.1.10:3000;   # Unraid-IP och port till containern
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

